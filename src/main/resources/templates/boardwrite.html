<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>글쓰기</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        /* 제목 스타일 */
        h1 {
            text-align: center;
            color: #4a67b0;
            margin-bottom: 20px;
        }

        /* 입력 필드 및 라벨 정렬 */
        .form-group {
            margin-bottom: 15px;
            margin-left: 100px;
            margin-right: 100px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
        }

        /* 버튼 컨테이너 */
        .btn-container {
            text-align: right; /* 버튼을 오른쪽 정렬 */
            margin-right: 100px; /* 폼과 동일한 오른쪽 여백 */
        }

        .write-btn {
            background-color: #4a67b0;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .write-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>글쓰기</h1>
    <form th:action="@{/board/write}" method="post">
        <div class="form-group">
            <label for="title">제목:</label>
            <input type="text" id="title" name="title" placeholder="제목을 입력하세요." required>
        </div>
        <div class="form-group">
            <label for="content">내용:</label>
            <textarea id="content" name="content" rows="10" placeholder="내용을 입력하세요." required></textarea>
        </div>
        <!-- 버튼 컨테이너 -->
        <div class="btn-container">
            <button class="write-btn" type="submit">작성</button>
        </div>
    </form>
</div>
</body>
</html>
