<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Service</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #4a67b0;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        /* 왼쪽 상단 환영 메시지 스타일 */
        .welcome-message {
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 16px;
            color: #fff;
        }
        header h1 {
            margin: 0;
            font-size: 32px;
        }
        .search-bar {
            position: absolute;
            top: 30px;
            right: 20px;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            padding: 5px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .search-bar button {
            background-color: #3AA387;
            border: none;
            padding: 5px 10px;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 5px;
        }
        .buttons {
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px;
            gap: 10px;
        }
        .buttons button {
            background-color: #efefef;
            border: 1px solid #ccc;
            color: #333;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        table thead th {
            background-color: #444;
            color: #fff;
            padding: 10px;
            border: 1px solid #ccc;
        }
        table tbody td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }
        table tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        table tbody tr:hover {
            background-color: #ddd;
        }
        .write-btn-container {
            text-align: right;
            margin: 20px 10%;
        }
        .write-btn {
            background-color: #4a67b0;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .write-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<header>
    <!-- 왼쪽 상단 환영 메시지 (welcomeMessage가 있을 경우) -->
    <div class="welcome-message" th:if="${welcomeMessage}" th:text="${welcomeMessage}">사용자님 환영합니다!</div>
    <h1>게시판</h1>
    <div class="search-bar">
        <input type="text" placeholder="검색">
        <button>검색</button>
    </div>
</header>

<div class="buttons">
    <!-- 로그인한 사용자가 있는 경우 로그아웃 버튼 표시 -->
    <div th:if="${session.loggedInUser != null}">
        <button onclick="location.href='/auth/logout'">로그아웃</button>
    </div>
    <!-- 로그인한 사용자가 없으면 로그인과 회원가입 버튼 표시 -->
    <div th:if="${session.loggedInUser == null}">
        <button onclick="location.href='/auth/login'">로그인</button>
        <button onclick="location.href='/auth/signup'">회원가입</button>
    </div>
</div>

<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성자</th>
        <th>작성일</th>
        <th>조회수</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="post : ${posts}">
        <td th:text="${post.id}"></td>
        <td th:text="${post.title}"></td>
        <td th:text="${post.author}"></td>
        <td th:text="${post.createdAt}"></td>
        <td>
            <a th:href="@{/board/{id}(id=${post.id})}">보기</a>
        </td>
    </tr>
    </tbody>
</table>
<form action="/board/write" method="get">
    <div class="write-btn-container">
        <button class="write-btn">글쓰기</button>
    </div>
</form>
</body>
</html>
